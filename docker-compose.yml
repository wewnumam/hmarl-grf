services:
  gfootball:
    image: gfootball
    container_name: gfootball-dev
    stdin_open: true
    tty: true
    working_dir: /gfootball
    environment:
      DISPLAY: host.docker.internal:0.0
    volumes:
      - .:/gfootball
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]