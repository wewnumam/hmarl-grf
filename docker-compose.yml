services:
  gfootball:
    image: gfootball:hmarl
    container_name: ${CONTAINER_NAME:-gfootball-dev}
    stdin_open: true
    tty: true
    working_dir: /gfootball
    # PID1 = auto-resuming training loop (scripts/train_loop.sh): crash/VM-reboot
    # resumes from latest checkpoint. Clean stop: `docker stop gfootball-dev`.
    # Completed run exits 0 -> on-failure keeps it down. Override via env below.
    command: bash /gfootball/scripts/train_loop.sh
    restart: on-failure
    environment:
      DISPLAY: host.docker.internal:0.0
      # Full 3M run (thesis main experiment): fresh from scratch, hard scenario,
      # no checkpoint reward, GAE 0.95 / ent 0.01 as written in BAB IV/V.
      # ~3 days wall clock at the measured ~10.6 env steps/s.
      TSTEPS: ${TSTEPS:-3000000}
      LOG_DIR: ${LOG_DIR:-dumps_3m}
      MODEL_DIR: ${MODEL_DIR:-checkpoints_3m}
      INIT_CKPT: ${INIT_CKPT:-}
      SCENARIO: ${SCENARIO:-11_vs_11_stochastic}
      CHECKPOINT_REWARD: ${CHECKPOINT_REWARD:-0}
    volumes:
      - .:/gfootball
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "6006:6006"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]