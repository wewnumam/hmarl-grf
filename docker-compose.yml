services:
  gfootball:
    image: gfootball
    container_name: ${CONTAINER_NAME:-gfootball-dev}
    stdin_open: true
    tty: true
    working_dir: /gfootball
    # PID1 = auto-resuming training loop (scripts/train_loop.sh): crash/VM-reboot
    # resumes from latest checkpoint. Clean stop: `docker stop gfootball-dev`.
    # Completed run exits 0 -> on-failure keeps it down. Override via env below.
    command: bash /gfootball/scripts/train_loop.sh
    restart: on-failure
    environment:
      DISPLAY: host.docker.internal:0.0
      TSTEPS: ${TSTEPS:-1650000}
      LOG_DIR: ${LOG_DIR:-dumps_obs106}
      MODEL_DIR: ${MODEL_DIR:-checkpoints_obs106}
      # leg 6: warm-start from obs105 (its defensive gains are real: GA 1.0/ep
      # greedy vs 7.6 random, ball_x -0.192 vs -0.375).  The stall was the
      # dead max(0, ball_x) gate, now reverted to two-sided.  Also: horizon
      # back to 3000, ENT_COEF 0.03.
      INIT_CKPT: ${INIT_CKPT:-checkpoints_obs105/hmarl_model.pt}
      SCENARIO: ${SCENARIO:-11_vs_11_easy_stochastic}
      CHECKPOINT_REWARD: ${CHECKPOINT_REWARD:-1}
    volumes:
      - .:/gfootball
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "6006:6006"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]